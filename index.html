<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Home Of UEFA - Sports Hub Official</title>
    
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/en/9/9d/UEFA_full_logo.svg" type="image/svg+xml">

    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #05070f;
            --card-bg: rgba(15, 23, 42, 0.75);
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --neon-pink: #ff007f;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.12) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER FUTURISTIK */
        header {
            background: rgba(10, 14, 26, 0.85);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 243, 255, 0.1);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-section img {
            height: 42px;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .brand-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: rgba(5, 7, 15, 0.6);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid var(--border-glow);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        /* MAIN CONTENT CONTAINER */
        main {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        /* PROMO BANNER */
        .promo-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .promo-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .promo-banner h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .promo-banner p {
            font-size: 0.95rem;
            color: #cbd5e1;
            max-width: 850px;
            margin: 0 auto;
        }

        .stream-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* CHANNEL SELECTOR BUTTONS */
        .channel-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .channel-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .channel-btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }

        .channel-btn.active {
            border-color: var(--neon-cyan);
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(157, 0, 255, 0.2));
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        /* PLAYER FRAME & CONTAINER */
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(12px);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 12px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .current-channel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse 1.5s infinite;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-pink);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: 500px !important;
        }

        .video-container video, 
        .video-container .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        /* CUSTOM VIDEO.JS THEME ACCENT */
        .vjs-default-skin .vjs-big-play-button {
            background-color: rgba(157, 0, 255, 0.7) !important;
            border-color: var(--neon-cyan) !important;
            border-radius: 50% !important;
            width: 2em !important;
            height: 2em !important;
            line-height: 2em !important;
            margin-top: -1em !important;
            margin-left: -1em !important;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* FOOTER */
        footer {
            background: rgba(10, 14, 26, 0.95);
            border-top: 1px solid var(--border-glow);
            text-align: center;
            padding: 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            backdrop-filter: blur(10px);
        }

        footer strong {
            color: var(--neon-cyan);
        }

        @media (max-width: 768px) {
            .video-container {
                height: 260px !important;
            }
            .brand-title h1 {
                font-size: 1rem;
            }
            .channel-btn {
                font-size: 0.75rem;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-section">
                <img src="https://upload.wikimedia.org/wikipedia/en/9/9d/UEFA_full_logo.svg" alt="UEFA Logo">
                <div class="brand-title">
                    <h1>HOME OF UEFA</h1>
                    <p>Sports Hub Official | Futuristic Media Center</p>
                </div>
            </div>

            <nav class="nav-tabs">
                <button class="tab-btn active">
                    <i class="fa-solid fa-satellite-dish"></i> LIVE BROADCAST
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="promo-banner">
            <h2><i class="fa-solid fa-bolt"></i> ULTRA-LOW LATENCY STREAMING</h2>
            <p>Nikmati siaran langsung olahraga berkecepatan tinggi dengan tampilan antarmuka generasi baru.</p>
        </section>

        <section class="stream-wrapper">
            <!-- Pilihan Channel Baru -->
            <div class="channel-selector">
                <button class="channel-btn active" onclick="switchChannel(0, this)">
                    <i class="fa-solid fa-play"></i> beIN Sports 2 Arabia
                </button>
                <button class="channel-btn" onclick="switchChannel(1, this)">
                    <i class="fa-solid fa-play"></i> Fox Sports 1 USA (Server 1)
                </button>
                <button class="channel-btn" onclick="switchChannel(2, this)">
                    <i class="fa-solid fa-play"></i> Fox Sports 1 USA (Server 2)
                </button>
            </div>

            <!-- Frame Pemutar Video -->
            <div class="player-card">
                <div class="player-header">
                    <div class="current-channel-title" id="channelNameDisplay">
                        <i class="fa-solid fa-tv"></i> <span>beIN Sports 2 Arabia</span>
                    </div>
                    <div class="live-badge">
                        <span class="live-dot"></span> LIVE
                    </div>
                </div>

                <div class="video-container" id="playerDisplay">
                    <!-- Dynamic VideoJS Element -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 <strong>Home Of UEFA</strong>. Powered by <strong>Sports Hub Official</strong>. All Rights Reserved.</p>
    </footer>

    <!-- Video.js JS Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        let player = null;

        // Daftar Channel Baru Sesuai Permintaan
        const channels = [
            {
                name: "beIN Sports 2 Arabia",
                src: "https://wqdfwqq.s3.us-east-2.amazonaws.com/bein2/720p/manifest.m3u8"
            },
            {
                name: "Fox Sports 1 USA (Server 1)",
                src: "https://footfytv.pro/proxy/direct?url=http://85.237.89.160:9590/usa-s/FOX-SPORTS-1/index.m3u8"
            },
            {
                name: "Fox Sports 1 USA (Server 2)",
                src: "https://tvsen7.aynascope.net/foxsports1/index.m3u8"
            }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            switchChannel(0, document.querySelectorAll('.channel-btn')[0]);
        });

        function switchChannel(index, btnElement) {
            const ch = channels[index];
            const display = document.getElementById("playerDisplay");
            const titleDisplay = document.querySelector("#channelNameDisplay span");

            // Update nama channel di judul frame
            if(titleDisplay) titleDisplay.innerText = ch.name;

            // Highlight tombol aktif
            let btns = document.getElementsByClassName("channel-btn");
            for (let i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }
            if(btnElement) btnElement.classList.add("active");

            // Hapus instansi player lama jika ada
            if (player) {
                player.dispose();
                player = null;
            }

            // Bersihkan kontainer
            display.innerHTML = "";

            // Buat elemen video baru
            const videoElem = document.createElement("video");
            videoElem.id = "videojsPlayer";
            videoElem.className = "video-js vjs-default-skin vjs-big-play-centered";
            videoElem.controls = true;
            videoElem.autoplay = true;
            videoElem.preload = "auto";
            display.appendChild(videoElem);

            // Inisialisasi Video.js
            player = videojs('videojsPlayer', {
                autoplay: true,
                controls: true,
                responsive: true,
                liveui: true
            });

            player.src({
                src: ch.src,
                type: "application/x-mpegURL"
            });

            player.play().catch(e => console.log("Autoplay dihalangi oleh browser:", e));
        }
    </script>
</body>
</html>
