<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Set Referrer Policy at document level -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Home Of UEFA - Sports Hub Official</title>
    
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/en/9/9d/UEFA_full_logo.svg" type="image/svg">

    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <style>
        :root {
            --primary-bg: #0b0e14;
            --card-bg: #161b22;
            --accent-blue: #0052b4;
            --neon-blue: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, rgba(11,14,20,1) 0%, rgba(22,27,34,0.8) 100%);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-section img {
            height: 38px;
            filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.3));
        }

        .brand-title h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #ffffff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--neon-blue));
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        main {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
        }

        .promo-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, rgba(22,27,34,0.9) 0%, rgba(11,14,20,0.9) 100%);
        }

        .promo-banner h2 {
            font-size: 1.2rem;
            color: var(--neon-blue);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .promo-banner p {
            font-size: 0.85rem;
            color: #d1d5db;
            line-height: 1.5;
            max-width: 850px;
            margin: 0 auto 12px auto;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stream-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .channel-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .channel-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-btn:hover {
            border-color: var(--neon-blue);
        }

        .channel-btn.active {
            border-color: var(--neon-blue);
            background: rgba(0, 210, 255, 0.15);
            color: var(--neon-blue);
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }

        .video-container:not(.vjs-fullscreen) {
            height: 450px !important;
        }

        .video-container video, 
        .video-container .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        footer {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 15px;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .video-container:not(.vjs-fullscreen) {
                height: 250px !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-section">
                <img src="https://upload.wikimedia.org/wikipedia/en/9/9d/UEFA_full_logo.svg" alt="UEFA Logo">
                <div class="brand-title">
                    <h1>HOME OF UEFA</h1>
                    <p>By Sports Hub Official | Football Media Center</p>
                </div>
            </div>

            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="openTab(event, 'stream')">
                    <i class="fa-solid fa-tv"></i> Live Stream
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="promo-banner">
            <h2>👑 UEFA CHAMPIONS LEAGUE & LIVE SPORTS</h2>
            <p>Watch live sports streams with high responsiveness and ultra-low latency.</p>
        </section>

        <!-- TAB 1: LIVE STREAM -->
        <section id="stream" class="tab-content active">
            <div class="stream-wrapper">
                <div class="channel-selector">
                    <button class="channel-btn active" onclick="playChannel(0, this)">
                        <i class="fa-solid fa-play"></i> CBC Sport
                    </button>
                    <button class="channel-btn" onclick="playChannel(1, this)">
                        <i class="fa-solid fa-play"></i> Tabii Spor 1 (A)
                    </button>
                    <button class="channel-btn" onclick="playChannel(2, this)">
                        <i class="fa-solid fa-play"></i> Tabii Spor 1 (A) 2
                    </button>
                </div>

                <div class="video-container" id="playerDisplay">
                    <video id="videojsPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay preload="auto"></video>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 <strong>Home Of UEFA</strong>. Powered by <strong>Sports Hub Official</strong>.</p>
    </footer>

    <!-- Video.js JS Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        let player = null;

        // Direct Channel List
        const channels = [
            {
                name: "CBC Sport",
                src: "https://andro.evrenesoglu99.click/checklist/androstreamlivecbcs.m3u8",
                type: "application/x-mpegURL",
                customHeader: "https://mahsunsports.xyz/"
            },
            {
                name: "Tabii Spor 1 (A)",
                src: "https://andro.evrenesoglu99.click/checklist/androstreamlivetb.m3u8",
                type: "application/x-mpegURL",
                customHeader: "https://mahsunsports.xyz/"
            },
            {
                name: "Tabii Spor 1 (A) 2",
                src: "http://andro.226503.xyz/checklist/androstreamlivetb.m3u8",
                type: "application/x-mpegURL",
                customHeader: "https://mahsunsports.xyz/"
            }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            initVideoPlayer();
            playChannel(0, document.querySelectorAll('.channel-btn')[0]);
        });

        function initVideoPlayer() {
            // Video.js Configuration with XHR Hook for M3U8 Requests
            player = videojs('videojsPlayer', {
                autoplay: true,
                controls: true,
                responsive: true,
                liveui: true,
                html5: {
                    vhs: {
                        overrideNative: true,
                        enableLowInitialPlaylist: true,
                        smoothQualityChange: true,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 6,
                        backBufferLength: 10,
                        xhr: function(options) {
                            // Attach custom headers during M3U8/TS requests
                            if (player && player.currentCustomHeader) {
                                options.headers = options.headers || {};
                                options.headers['X-Requested-With'] = 'XMLHttpRequest';
                            }
                            return options;
                        }
                    }
                }
            });
        }

        function playChannel(index, btnElement) {
            const ch = channels[index];

            // Update active button state
            let btns = document.getElementsByClassName("channel-btn");
            for (let i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }
            if(btnElement) btnElement.classList.add("active");

            // Store custom header reference
            player.currentCustomHeader = ch.customHeader;

            // Load direct stream
            player.src({
                src: ch.src,
                type: ch.type
            });

            player.play().catch(e => console.log("Autoplay prevented by browser:", e));
        }

        function openTab(evt, tabName) {
            let i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
